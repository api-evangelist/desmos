name: Desmos
description: >-
  Desmos (Desmos Studio PBC) is the dead-simple way to embed rich, interactive
  math into a web page or web app. Its developer product is not a REST API but a
  client-side JavaScript library that mounts embeddable calculators — a
  full-featured Graphing Calculator, a 3D Calculator, and Geometry, Scientific,
  and Four-Function calculators — controlled through a browser object model
  (expressions, graph state, screenshots, and events). The API loads via a single
  versioned script include and authenticates with an API key passed as a URL
  parameter. Founded in 2011 by Eli Luberoff and originally backed by GV, the
  world-renowned Desmos calculators now operate as an independent public benefit
  corporation and remain free to all, while the Desmos curriculum business was
  acquired by Amplify in 2022.
